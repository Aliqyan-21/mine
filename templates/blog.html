<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>{title}</title>
  <script>
    const t = localStorage.getItem('theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/sunburst.min.css">
  <link rel="stylesheet" href="/styles/{css}">
</head>

<body>
  <nav class="rattip-back-container">
    <a href="/blogs/index.html" class="rattip-back-btn">
      <span class="rattip-back-prompt">$</span>
      <span class="rattip-back-cmd">cd</span>
      <span class="rattip-back-arg">../blogs</span>
    </a>
  </nav>
  <header class="rattip-header">
    <span class="rattip-date">{blog_date}</span>
    <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()" aria-label="toggle theme">☀</button>
  </header>
  {md_content}

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>

  <footer class="rattip-footer"> made using rattip | © aliqyan-21 </footer>
  <script>
    (function () {
      function updateBtn() {
        const btn = document.getElementById('theme-btn');
        if (!btn) return;
        btn.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? '☽' : '☀';
      }
      updateBtn();
      window.toggleTheme = function () {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'light' ? '' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateBtn();
      };
    })();
  </script>
</body>
</body>

</html>
